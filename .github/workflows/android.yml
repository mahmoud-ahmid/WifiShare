name: Android CI

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Read version (before build)
        id: ver
        run: |
          CODE=$(grep version.code version.properties | cut -d= -f2)
          echo "code=$CODE" >> $GITHUB_OUTPUT

      - name: Build APK
        run: gradle assembleDebug --no-daemon

      - name: Commit version bump
        if: github.event_name == 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet version.properties; then
            echo "::notice::No version change"
          else
            git add version.properties
            git commit -m "chore: auto-bump version [skip ci]" || true
            git push origin HEAD:${{ github.ref_name }} || true
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: WifiShare-debug-v${{ steps.ver.outputs.code }}
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
